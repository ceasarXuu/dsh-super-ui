name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Syntax check and unit tests
        run: npm run verify

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      # Trusted publishing authenticates through OIDC (`id-token: write`
      # above), so no token is needed. Set the repository variable
      # NPM_TOKEN_PUBLISH=true to fall back to the NPM_TOKEN secret instead
      # (for example while a trusted publisher connection is unavailable).
      - name: Configure the bootstrap token only when explicitly requested
        if: vars.NPM_TOKEN_PUBLISH == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN_PUBLISH is set but the NPM_TOKEN secret is missing" >&2
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"

      - name: Check whether this version is already published
        id: check
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@ceasarxuu/dsh-super-ui@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public --registry=https://registry.npmjs.org/
